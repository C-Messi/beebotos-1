[package]
name = "beebotos-update-client"
version = "1.0.0"
edition = "2021"
description = "Core update client library for BeeBotOS"
license = "MIT"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Version parsing
semver = "1.0"

# DateTime
chrono = { workspace = true }

# Crypto
sha2 = { workspace = true }
ed25519-dalek = "2.1"
base64 = "0.22"

# Utilities
tracing = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }

# Platform-specific HTTP clients
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }
tokio = { workspace = true, features = ["fs", "process", "io-util"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
dirs = "5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.5"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "ServiceWorker", "ServiceWorkerRegistration"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
