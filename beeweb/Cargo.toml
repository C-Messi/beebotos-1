[package]
name = "beebotos-beeweb"
version = "1.0.0"
edition = "2021"
description = "BeeWeb Server - Remote software update server for BeeBotOS"
license = "MIT"

[[bin]]
name = "beeweb"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }
async-trait = { workspace = true }

# Web framework
axum = { workspace = true, features = ["http2"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace", "compression-full", "timeout", "limit"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# DateTime
chrono = { workspace = true }

# Version parsing
semver = "1.0"

# Crypto
sha2 = { workspace = true }
ed25519-dalek = "2.1"
base64 = "0.22"

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
prometheus = { workspace = true }

# Utilities
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }

# Storage
dashmap = "6.0"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "migrate", "chrono", "uuid"], default-features = false }

# HTTP Client (for health checks)
reqwest = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
