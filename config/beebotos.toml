[channels]
auto_download_media = false
auto_reply = true
context_window_size = 20
enable_typing_indicator = true
enabled_platforms = [
    "personal_wechat",
    "lark",
    "wechat",
]
max_file_size_mb = 50
media_storage_path = "./data/media"

[channels.lark]
app_id = "cli_a92ba86d9978dbcd"
enabled = true
encrypt_key = ""
verification_token = ""

[channels.personal_wechat]
agent_id = "beebotos-gateway"
api_key = ""
base_url = "https://ilinkai.weixin.qq.com"
device_id = ""
device_name = "BeeBotOS Gateway"
enabled = true

[channels.wechat]
agent_id = "1000004"
corp_id = "ww812fdb0ce621af12"
enabled = true

[database]
connect_timeout_seconds = 10
idle_timeout_seconds = 600
max_connections = 20
min_connections = 5
run_migrations = true
url = "sqlite:data/beebotos.db"

[jwt]
audience = "beebotos-api"
expiry_hours = 24
issuer = "beebotos-gateway"
refresh_expiry_hours = 168

[logging]
format = "json"
level = "info"
otel_enabled = false
otel_endpoint = "http://localhost:4317"

[models]
default_provider = "kimi"
fallback_chain = []
max_tokens = 4096
request_timeout = 180
system_prompt = "你是 BeeBotOS 的个人 AI 助手，由 BeeBotOS 团队开发。请始终以这个身份回答用户问题。"

[models.kimi]
base_url = "https://api.moonshot.cn/v1"
model = "kimi-k2.6"
temperature = 1.0

[models.zhipu]
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-4"
temperature = 0.7

[rate_limit]
burst_size = 50
enabled = true
requests_per_second = 10
window_seconds = 60

[server]
host = "0.0.0.0"
keepalive_seconds = 75
max_body_size = 10485760
max_connections = 1000
port = 8000
timeout_seconds = 30

[server.cors]
allow_credentials = false
allowed_headers = [
    "Content-Type",
    "Authorization",
    "X-Requested-With",
    "X-CSRF-Token",
]
allowed_methods = [
    "GET",
    "POST",
    "PUT",
    "DELETE",
    "OPTIONS",
]
allowed_origins = ["*"]

[services]
chain_timeout_seconds = 30
chain_url = "http://localhost:8545"
kernel_timeout_seconds = 30
kernel_url = "http://localhost:9000"

[tls]
cert_path = "data/certs/server.crt"
enabled = false
key_path = "data/certs/server.key"
mutual_tls = false

# ── MCP (Model Context Protocol) ──
# Connect to external MCP servers on startup.
# Each server needs a unique name and a transport configuration.
#
# Example: stdio transport (local subprocess)
# [[mcp.servers]]
# name = "filesystem"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#
# Example: HTTP transport (remote server)
# [[mcp.servers]]
# name = "github"
# transport = "http"
# url = "https://api.github.com/mcp"
# auth_token = "ghp_xxxxxxxxxxxx"
# use_sse = true

# Alpaca Trading API MCP Server
# Provides 60+ tools for stock trading, market data, and account management.
# Requires ALPACA_API_KEY and ALPACA_SECRET_KEY from https://alpaca.markets/
[[mcp.servers]]
name = "alpaca"
transport = "stdio"
command = "uv"
args = ["run", "--quiet", "python", "-m", "alpaca_mcp_server.cli"]
working_dir = "/root/alpaca-mcp-server"
# TODO: Fill in your Alpaca API credentials
env = { ALPACA_API_KEY = "PKJX2TXVDNC33FEM3TSRKRSP4S", ALPACA_SECRET_KEY = "9AyE34tuoTj1TSbZDpmfHmkrrSf7M16QUQBTEJm6M7mR" }

[mcp]
auto_init = true
timeout_ms = 30000
retry_count = 3
# Security: enforce HTTPS for HTTP transport URLs (reject http://)
enforce_tls = true
# Security: allowed commands for stdio transport (empty = allow all)
# Examples: ["npx", "python", "/usr/local/bin/mcp-server"]
allowed_commands = []
