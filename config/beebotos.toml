[models]
default_provider = "deepseek"
fallback_chain = []
max_tokens = 4096
request_timeout = 180
system_prompt = "You are a helpful assistant."

[models.deepseek]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
reasoning_effort = "high"
temperature = 0.7
thinking = "enabled"

[models.gpt4]
base_url = "https://api.openai.com/v1"
model = "gpt-4o"
temperature = 0.7

[models.kimi]
base_url = "https://api.moonshot.cn/v1"
model = "kimi-k2.6"
temperature = 1.0
thinking = "enabled"

[models.zhipu]
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-4"
temperature = 0.7

[rate_limit]
burst_size = 50
enabled = true
requests_per_second = 10
window_seconds = 60

[server]
host = "0.0.0.0"
keepalive_seconds = 75
max_body_size = 10485760
max_connections = 1000
port = 8000
timeout_seconds = 30

[server.cors]
allow_credentials = false
allowed_headers = [
    "Content-Type",
    "Authorization",
    "X-Requested-With",
    "X-CSRF-Token",
]
allowed_methods = [
    "GET",
    "POST",
    "PUT",
    "DELETE",
    "OPTIONS",
]
allowed_origins = ["*"]

[services]
chain_timeout_seconds = 30
chain_url = "http://localhost:8545"
kernel_timeout_seconds = 30
kernel_url = "http://localhost:9000"

[tls]
cert_path = "data/certs/server.crt"
enabled = false
key_path = "data/certs/server.key"
mutual_tls = false
