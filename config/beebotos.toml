[channels]
auto_download_media = false
auto_reply = true
context_window_size = 20
enable_typing_indicator = true
enabled_platforms = [
    "personal_wechat",
    "lark",
    "wechat",
]
max_file_size_mb = 50
media_storage_path = "./data/media"

[channels.lark]
app_id = "cli_a92ba86d9978dbcd"
enabled = true
encrypt_key = ""
verification_token = ""

[channels.personal_wechat]
agent_id = "beebotos-gateway"
api_key = ""
base_url = "https://ilinkai.weixin.qq.com"
device_id = ""
device_name = "BeeBotOS Gateway"
enabled = true

[channels.wechat]
agent_id = "1000004"
corp_id = "ww812fdb0ce621af12"
enabled = true

[database]
connect_timeout_seconds = 10
idle_timeout_seconds = 600
max_connections = 20
min_connections = 5
run_migrations = true
url = "sqlite:data/beebotos.db"

[jwt]
audience = "beebotos-api"
expiry_hours = 24
issuer = "beebotos-gateway"
refresh_expiry_hours = 168

[logging]
format = "json"
level = "info"
otel_enabled = false
otel_endpoint = "http://localhost:4317"

[mcp]
allowed_commands = []
auto_init = true
enforce_tls = true
retry_count = 3
timeout_ms = 60000

# MT5 MCP server example. Keep this disabled until each deployment fills in its
# own login, password, broker server, and terminal path.
#
